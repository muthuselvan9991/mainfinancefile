<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Reports and Calculations</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#0f766e;--bd:#e2e5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a2b0;--ac:#2dd4bf;--bd:#2c333b}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:18px}
.hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.hd input{font-size:18px;font-weight:700;border:0;border-bottom:2px solid var(--ac);background:transparent;color:var(--tx);padding:4px;min-width:160px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1850px;font-size:13px}
th{background:var(--bg);text-align:left;padding:8px 6px;white-space:nowrap;border-bottom:1px solid var(--bd)}
td{padding:4px;border-bottom:1px solid var(--bd)}
td input{width:100%;box-sizing:border-box;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font-size:13px}
td.o{font-weight:600;white-space:nowrap;padding:4px 8px}
tfoot td{font-weight:700;padding:8px 6px}
.x{background:transparent;color:#dc2626;padding:4px 8px;font-size:16px}
#ov{display:none}body.pm h1,body.pm .sub,body.pm .bar,body.pm #app{display:none}
.mb{background:var(--card);border-radius:12px;padding:14px;width:100%;box-sizing:border-box}
@media print{body.pm #app,body.pm h1,body.pm .sub{display:none}#ov{position:static;background:none;padding:0}.bar,.x,.add,.dl{display:none}body{background:#fff;color:#000}.card{border:0}input{border:0!important}}
#lg{display:flex;min-height:85vh;align-items:center;justify-content:center}
.lc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:26px;width:min(360px,100%);box-sizing:border-box}
.lc h2{margin:0 0 4px;font-size:20px}.lc label{display:block;font-size:13px;color:var(--mu);margin:14px 0 4px}
.lc input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.lc button.go{width:100%;margin-top:18px;padding:11px;font-size:15px}
#lerr{color:#dc2626;font-size:13px;min-height:18px;margin-top:10px}
@media print{#lg{display:none!important}}
</style></head><body>
<div id="lg"><div class="lc">
<h2>💰 Finance Reports</h2><div style="color:var(--mu);font-size:13px">Login pannunga</div>
<label>User Name</label><input id="lu" type="text" autocomplete="username" onkeydown="if(event.key=='Enter')document.getElementById('lp').focus()">
<label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()">
<label style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" style="width:auto" onchange="document.getElementById('lp').type=this.checked?'text':'password'"> Show password</label>
<div id="lerr"></div>
<button class="go" onclick="doLogin()">Login</button>
</div></div>
<div id="main" style="display:none">
<h1>Finance Reports and Calculations</h1>
<div class="sub">Amount + Rate enter pannina Per Day / Per Month interest auto-a varum. Start Date + Days enter pannina End Date varum.</div>
<div class="bar">
<label style="font-size:13px">Rate basis:
<select id="basis" onchange="save();render()"><option value="30">per month (₹ per 100 / month)</option><option value="365">per year (% per annum)</option></select></label>
<button onclick="dlAll()">⬇ Download All (Excel/CSV)</button>
<button class="g" onclick="window.print()">🖨 Print / Save PDF</button>
<button style="background:#dc2626" onclick="showTO(-1)">⏳ All Pending Name List</button>
<button style="background:#16a34a" onclick="showTO(-1,'d')">✅ All Deposited Name List</button>
<button style="background:#7c3aed" onclick="showTO(-1,'f')">💹 Overall Interest</button>
<button style="background:#0ea5e9" onclick="showExp()">🧾 Expenses</button>
<button style="background:#b45309" onclick="showOver()">⌛ End Date Over Name List</button>
<span id="ulbl" style="margin-left:auto;font-size:13px;color:var(--mu)"></span><button class="g" onclick="logout()">Logout</button>
</div>
<div id="app"></div>
<div id="ov"></div>
</div>
<script>
let S;
const blank=()=>({name:"",native:"",guar:"",amt:"",rate:"",start:"",days:"",dep:"",type:""});
function load(){try{S=JSON.parse(localStorage.getItem("fin2"))}catch(e){}
if(!S){try{S=JSON.parse(localStorage.getItem("fin1"))}catch(e){}}
if(!S)S={basis:"30",p:[{title:"",rows:[blank()]},{title:"",rows:[blank()]}]}
const T=["Partner 1 - Elangovan","Partner 2 - Mathiyalagan"];S.p.forEach((p,i)=>{if(!p.title||/^Partner [12]$/.test(p.title))p.title=T[i]})}
function save(){S.basis=document.getElementById("basis").value;try{localStorage.setItem("fin2",JSON.stringify(S))}catch(e){}}
const B=()=>+S.basis;
function pday(r){return (+r.amt||0)*(+r.rate||0)/100/B()}
function pmon(r){return pday(r)*30}
function st(r){const a=+r.amt||0;if(!a)return"";return dep(r)>=a?"Done":"Pending"}
function stBadge(r){const t=st(r);if(!t)return"";const c=t=="Done"?"#16a34a":"#d97706";return `<span style="background:${c};color:#fff;padding:3px 10px;border-radius:12px;font-size:12px">${t}</span>`}
function cnt(r){const d=+r.days||0;if(!d||!r.type)return 0;
if(r.type=="D")return d;
if(r.type=="M")return Math.max(1,Math.floor(d/30));
if(r.type=="W"){if(!r.start)return 0;const[y,m,dd]=r.start.split('-').map(Number);let c=0;for(let i=1;i<=d;i++){if(new Date(y,m-1,dd+i).getDay()==0)c++}return Math.max(1,c)}return 0}
function pay(r){const n=cnt(r);if(!n)return 0;return Math.ceil(((+r.amt||0)+intr(r))/n)}
function payCell(r){const n=cnt(r);if(!n)return"";const u={W:"Sundays",M:"months",D:"days"}[r.type];return f(pay(r))+' <small style="color:var(--mu);font-weight:400">× '+n+' '+u+'</small>'}
function sumP(r){return (r.pays||[]).reduce((s,x)=>s+(+x.a||0),0)}
function hasP(r){return !!(r.pays&&r.pays.length)}
function dep(r){return hasP(r)?sumP(r):(+r.dep||0)}
function intr(r){return pday(r)*(+r.days||0)}
function endD(r){if(!r.start||!r.days)return"";const[y,m,dd]=r.start.split('-').map(Number);const d=new Date(y,m-1,dd+ +r.days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fd(s){if(!s)return"";const[a,b,c]=s.split("-");return c+"-"+b+"-"+a}
const f=n=>n.toLocaleString("en-IN",{maximumFractionDigits:2});
function render(){document.getElementById("basis").value=S.basis;
document.getElementById("app").innerHTML=S.p.map((p,i)=>`<div class="card"><div class="hd">
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input value="${p.title.replace(/"/g,"&quot;")}" onchange="S.p[${i}].title=this.value;save()"><button style="background:#d97706" onclick="showTO(${i})">⏳ Pending Name List</button><button style="background:#16a34a" onclick="showTO(${i},'d')">✅ Deposited Name List</button><button style="background:#7c3aed" onclick="showTO(${i},'f')">💹 Profit</button></div>
<span class="dl"><button onclick="add(${i})" class="add">+ Add Row</button> <button class="g" onclick="dl(${i})">⬇ Download</button></span></div>
<div class="sc"><table><thead><tr><th>No</th><th>Name</th><th>Phone Number</th><th>Guarantor Name</th><th>Type</th><th>Amount ₹</th><th>Interest Rate</th><th>Per Day Interest ₹</th><th>Per Month Interest ₹</th><th>Starting Date</th><th>Days (75/100...)</th><th>End Date</th><th>Method (Pay) ₹</th><th>Deposit Amount ₹</th><th>Total Interest ₹</th><th>Status</th><th>Details</th><th></th></tr></thead><tbody>
${p.rows.map((r,j)=>`<tr><td>${j+1}</td>
<td><input value="${r.name}" oninput="S.p[${i}].rows[${j}].name=this.value;save()" onchange="u(${i},${j},'name',this.value)"></td>
<td><input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="10 digit number" value="${String(r.native).replace(/[^0-9]/g,'').slice(0,10)}" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10);S.p[${i}].rows[${j}].native=this.value;save();var a=this.closest('tr').querySelector('.amt');if(a){a.readOnly=this.value.length!=10;a.placeholder=a.readOnly?'Phone 10 digit mudhala':''}" onchange="u(${i},${j},'native',this.value.replace(/[^0-9]/g,'').slice(0,10))"></td>
<td><input value="${r.guar}" oninput="S.p[${i}].rows[${j}].guar=this.value;save()" onchange="u(${i},${j},'guar',this.value)"></td>
<td><select onchange="u(${i},${j},'type',this.value)" style="padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font-size:13px"><option value="">Select</option><option value="W"${r.type=="W"?" selected":""}>W - Weekly</option><option value="M"${r.type=="M"?" selected":""}>M - Monthly</option><option value="D"${r.type=="D"?" selected":""}>D - Daily</option></select></td>
<td><input class="amt" type="number" value="${r.amt}"${ph10(r)?"":' readonly placeholder="Phone 10 digit mudhala"'} onclick="needPh(this)" onfocus="needPh(this)" onchange="u(${i},${j},'amt',this.value)"></td>
<td><input type="number" step="0.01" value="${r.rate}" onchange="u(${i},${j},'rate',this.value)"></td>
<td class="o">${f(pday(r))}</td>
<td class="o">${f(pmon(r))}</td>
<td><input type="text" inputmode="numeric" maxlength="10" placeholder="dd-mm-yyyy" value="${fd(r.start)}" oninput="fmtD(this)" onchange="setD(${i},${j},this.value)" style="min-width:110px"></td>
<td><input type="number" value="${r.days}" onchange="u(${i},${j},'days',this.value)"></td>
<td class="o">${fd(endD(r))}</td>
<td class="o">${payCell(r)}</td>
<td class="o">${f(dep(r))}</td>
<td class="o">${f(intr(r))}</td>
<td class="o">${stBadge(r)}${st(r)=="Done"?((r.name&&r.native&&r.type)?` <button onmousedown="event.preventDefault()" onclick="submitRow(${i},${j})" style="padding:4px 10px;font-size:12px;margin-left:6px">Submit</button>`:` <small style="color:#dc2626">Name, Phone, Type podunga</small>`):""}${intNote(r)}</td>
<td><button class="g" onclick="showDet(${i},${j})" style="padding:6px 12px;font-size:12px">Details</button></td>
<td><button class="x" onclick="del(${i},${j})">✕</button></td></tr>`).join("")}
</tbody><tfoot><tr><td colspan="5">Total</td><td>${f(p.rows.reduce((s,r)=>s+(+r.amt||0),0))}</td><td></td><td>${f(p.rows.reduce((s,r)=>s+pday(r),0))}</td><td>${f(p.rows.reduce((s,r)=>s+pmon(r),0))}</td><td colspan="3"></td><td></td><td>${f(p.rows.reduce((s,r)=>s+dep(r),0))}</td><td>${f(p.rows.reduce((s,r)=>s+intr(r),0))}</td><td></td><td></td><td></td></tr></tfoot></table></div><div class="dl" style="margin-top:10px"><button class="add" onclick="add(${i})">+ Add Row</button></div></div>`).join("")}
function fmtD(el){let d=el.value.replace(/\D/g,"").slice(0,8),o=d;if(d.length>4)o=d.slice(0,2)+"-"+d.slice(2,4)+"-"+d.slice(4);else if(d.length>2)o=d.slice(0,2)+"-"+d.slice(2);el.value=o}
function setD(i,j,v){const m=v.match(/^(\d{2})-(\d{2})-(\d{4})$/);let iso="";if(m){const d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getDate()==+m[1]&&d.getMonth()==+m[2]-1){iso=m[3]+"-"+m[2]+"-"+m[1]}else alert("Date seriyilla: "+v)}else if(v)alert("dd-mm-yyyy format-la podunga (e.g. 01-10-2026)");u(i,j,"start",iso)}
function needPh(el){if(el.readOnly)toast("📞 Mudhalla Phone Number 10 digit enter pannunga","#dc2626")}
function ph10(r){return String(r.native||'').replace(/[^0-9]/g,'').length==10}
function u(i,j,k,v){try{const t=window.event&&window.event.target;if(t&&t.nodeType==1&&!t.isConnected)return}catch(e){}if(!S.p[i]||!S.p[i].rows[j])return;if(k=='amt'&&!ph10(S.p[i].rows[j]))return;S.p[i].rows[j][k]=v;save();render()}
function add(i){S.p[i].rows.push(blank());save();render()}
function del(i,j){if(S.p[i].rows.length>1)S.p[i].rows.splice(j,1);else S.p[i].rows[0]=blank();save();render()}
const H=["No","Name","Phone Number","Guarantor Name","Type","Amount","Interest Rate","Per Day Interest","Per Month Interest","Starting Date","Days","End Date","Pay","Deposit Amount","Total Interest","Status"];
const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
function csv(p){let o=[[p.title],H];p.rows.forEach((r,j)=>o.push([j+1,r.name,r.native,r.guar,({W:'Weekly',M:'Monthly',D:'Daily'})[r.type]||'',r.amt,r.rate,pday(r).toFixed(2),pmon(r).toFixed(2),fd(r.start),r.days,fd(endD(r)),pay(r)||'',dep(r)||'',intr(r).toFixed(2),st(r)]));
o.push(["Total","","","","",p.rows.reduce((s,r)=>s+(+r.amt||0),0),"",p.rows.reduce((s,r)=>s+pday(r),0).toFixed(2),p.rows.reduce((s,r)=>s+pmon(r),0).toFixed(2),"","","","",p.rows.reduce((s,r)=>s+dep(r),0),p.rows.reduce((s,r)=>s+intr(r),0).toFixed(2),""]);return o.map(r=>r.map(q).join(",")).join("\n")}
function get(name,t){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv;charset=utf-8"}));a.download=name;a.click()}
function dl(i){get(S.p[i].title+"-report.csv",csv(S.p[i]))}
function dlAll(){get("finance-report.csv",S.p.map(csv).join("\n\n"))}
let curK=-1,curM='p';
function tdy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tl(r){return ({W:'Weekly',M:'Monthly',D:'Daily'})[r.type]||''}
function toast(m,c){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3)";document.body.appendChild(t)}t.style.background=c||"#16a34a";t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display="none"},2500)}
function submitRow(i,j){try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}catch(e){}
const p=S.p[i],r=p&&p.rows[j];if(!r||st(r)!="Done")return;const du=idue(r,tdy());if(du>0){toast("⚠ Interest kattalai: ₹"+f(du)+" baaki. Interest katta piragu dhaan Done kudukka mudiyum","#dc2626");return}
const nm=r.name;r.subm=tdy();(p.done=p.done||[]).push(r);p.rows.splice(j,1);if(!p.rows.length)p.rows.push(blank());save();render();toast("✅ "+nm+" - Deposited Name List-ku poiduchu")}
function restoreRow(x,y){const p=S.p[x],r=p.done.splice(y,1)[0];if(!r)return;delete r.subm;if(p.rows.length==1&&!p.rows[0].amt&&!p.rows[0].name)p.rows[0]=r;else p.rows.push(r);save();render();openTO(curK,curM)}
function showTO(k,m){m=m||'p';openTO(k,m);try{history.pushState(null,"","#"+m+k)}catch(e){}}
function hideTO(){closeTO();try{if(/^#([pdf]-?\d+|x\d+_\d+|e|o)$/.test(location.hash))history.back()}catch(e){}}
window.addEventListener("popstate",()=>{const h=location.hash;let m=h.match(/^#([pdf])(-?\d+)$/);if(m)return openTO(+m[2],m[1]);m=h.match(/^#x(\d+)_(\d+)$/);if(m)return openDet(+m[1],+m[2]);if(h=="#e")return openExp();h=="#o"?openOver():closeTO()});
function toRows(k){const o=[];S.p.forEach((p,x)=>{if(k>=0&&x!=k)return;p.rows.forEach(r=>{const a=+r.amt||0,d=dep(r);if(a>0&&d<a)o.push({pt:p.title,name:r.name,ph:r.native,g:r.guar,a:a,d:d,b:a-d})})});return o}
function toRowsD(k){const o=[];S.p.forEach((p,x)=>{if(k>=0&&x!=k)return;(p.done||[]).forEach((r,y)=>o.push({pt:p.title,x:x,y:y,r:r}))});return o}
function ttl(k,m){if(m=='f')return k>=0&&S.p[k]?S.p[k].title+" - Profit":"Overall Interest";if(m=='d')return k>=0&&S.p[k]?S.p[k].title+" - Deposited Name List":"All Deposited Name List";return k>=0&&S.p[k]?S.p[k].title+" - Pending Name List":"All Pending Name List"}
function openTO(k,m){if(k===undefined)k=-1;m=m||'p';curK=k;curM=m;const all=k<0,ov=document.getElementById("ov");let hd,tb,ft,ex="";
if(m=='d'){const o=toRowsD(k);
hd=`<th>No</th>${all?"<th>Partner</th>":""}<th>Name</th><th>Phone Number</th><th>Guarantor Name</th><th>Type</th><th>Amount ₹</th><th>Total Interest ₹</th><th>Deposit ₹</th><th>Submitted On</th><th></th>`;
tb=o.length?o.map((e,i)=>{const r=e.r;return `<tr><td>${i+1}</td>${all?"<td>"+e.pt+"</td>":""}<td>${r.name}</td><td>${r.native}</td><td>${r.guar}</td><td>${tl(r)}</td><td>${f(+r.amt||0)}</td><td>${f(intr(r))}</td><td style="font-weight:700;color:#16a34a">${f(dep(r))}</td><td>${fd(r.subm)}</td><td><button class="x" style="color:var(--ac)" onclick="restoreRow(${e.x},${e.y})">↩ Restore</button></td></tr>`}).join(""):`<tr><td colspan="${all?11:10}" style="padding:16px;text-align:center">Innum yaarum deposited list-ku submit aagala</td></tr>`;
ft=`<td colspan="${all?6:5}">Total</td><td>${f(o.reduce((s,e)=>s+(+e.r.amt||0),0))}</td><td>${f(o.reduce((s,e)=>s+intr(e.r),0))}</td><td>${f(o.reduce((s,e)=>s+dep(e.r),0))}</td><td></td><td></td>`}
else if(m=='f'){const o=toRowsD(k);const tA=o.reduce((s,e)=>s+(+e.r.amt||0),0),tI=o.reduce((s,e)=>s+intr(e.r),0),tL=o.reduce((s,e)=>s+ipaid(e.r),0);
hd=`<th>No</th>${all?"<th>Partner</th>":""}<th>Name</th><th>Type</th><th>Amount ₹</th><th>Interest ₹</th><th>Late Interest ₹</th>`;
tb=o.length?o.map((e,i)=>`<tr><td>${i+1}</td>${all?"<td>"+e.pt+"</td>":""}<td>${e.r.name}</td><td>${tl(e.r)}</td><td>${f(+e.r.amt||0)}</td><td style="font-weight:700;color:#16a34a">${f(intr(e.r))}</td><td style="font-weight:700;color:#16a34a">${f(ipaid(e.r))}</td></tr>`).join(""):`<tr><td colspan="${all?7:6}" style="padding:16px;text-align:center">Innum yaarum submit aagala, profit illa</td></tr>`;
ft=`<td colspan="${all?4:3}">Total</td><td>${f(tA)}</td><td>${f(tI)}</td><td>${f(tL)}</td>`;
ex=profBoxes(k)}
else{const o=toRows(k);
hd=`<th>No</th>${all?"<th>Partner</th>":""}<th>Name</th><th>Phone Number</th><th>Guarantor Name</th><th>Amount ₹</th><th>Deposit ₹</th><th>Balance ₹</th>`;
tb=o.length?o.map((r,i)=>`<tr><td>${i+1}</td>${all?"<td>"+r.pt+"</td>":""}<td>${r.name}</td><td>${r.ph}</td><td>${r.g}</td><td>${f(r.a)}</td><td>${f(r.d)}</td><td style="font-weight:700;color:#dc2626">${f(r.b)}</td></tr>`).join(""):`<tr><td colspan="${all?8:7}" style="padding:16px;text-align:center">Yaarum pending illa - ellarum Done ✅</td></tr>`;
ft=`<td colspan="${all?5:4}">Total</td><td>${f(o.reduce((s,r)=>s+r.a,0))}</td><td>${f(o.reduce((s,r)=>s+r.d,0))}</td><td>${f(o.reduce((s,r)=>s+r.b,0))}</td>`}
